name: Collecte des tarifs

on:
  schedule:
    # Deux passages par jour : une nouvelle délibération CRE est publiée
    # dans la journée, on la reprend au plus tard ~12 h après.
    - cron: "17 5 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:
  # Un changement manuel des fichiers publiés, de la config ou de la page est mis en ligne
  # tout de suite (le site Pages n'est déployé que par ce workflow).
  push:
    branches: [main]
    paths: ["docs/**", "config/**", "scripts/tarif_kwh/page.py"]

permissions:
  contents: write   # commit des JSON
  issues: write     # alertes
  actions: write    # maintien en vie de la planification
  pages: write      # déploiement du site (etat.json avec signe de vie)
  id-token: write   # requis par actions/deploy-pages

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Tests (sources réelles enregistrées)
        run: pytest -q

      - name: Collecte et publication
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect.py --site _site

      - name: Commit des changements
        run: |
          git add docs data
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git -c user.name="tarif-kwh[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "Mise à jour des tarifs ($(date -u +%F))"
            git pull --rebase --quiet
            git push
          fi

      # Signe de vie : le site est redéployé à chaque passage réussi, même sans
      # changement de tarif. etat.json y porte derniere_verification (date de ce
      # passage) et sources_en_echec ; le dépôt, lui, ne reçoit aucun commit.
      # Si la collecte échoue, rien n'est déployé et derniere_verification vieillit.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Déploiement GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v5

      # GitHub désactive les workflows planifiés après 60 jours sans activité
      # sur le dépôt. Comme les tarifs ne changent que deux fois par an, on
      # réactive explicitement le workflow à chaque passage (appel d'API, sans
      # commit factice).
      - name: Maintien en vie de la planification
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/collecte.yml/enable"
